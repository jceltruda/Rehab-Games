{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehab Games - Pong</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        .pong-container {
            margin: 30px auto 0;
            max-width: 800px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            display: none; /* shown after Start Game */
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            background-color: #000;
        }

        .game-controls {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .difficulty-controls button,
        #gameControlButton {
            font-family: var(--font-pixel);
            font-size: 0.9rem;
            color: var(--neon-cyan);
            background-color: transparent;
            border: 2px solid var(--neon-cyan);
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-controls button:hover,
        #gameControlButton:hover {
            box-shadow: 0 0 10px var(--neon-cyan) inset, 0 0 15px var(--neon-cyan);
        }
        
        .active-difficulty {
            background-color: var(--neon-cyan);
            color: var(--dark-bg);
        }
        
        .webcam-container {
            margin-top: 16px;
            display: flex; /* This will be toggled by JS */
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .webcam-toggle {
            font-size: 0.9rem;
            color: #eee;
            margin-top: 2rem; /* Space from buttons/game */
            margin-bottom: 8px; 
            display: inline-block;
        }

        .webcam-video-wrapper {
            position: relative;
            display: inline-block;
        }

        #webcam {
            max-width: 400px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            background: #000;
            transform: scaleX(-1); 
        }

        #webcamOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>
    <div class="home-container">
        <h1>Pong</h1>
        <h2>Control the paddle with your arm.</h2>

        <div class="description-box">
            <p>
                A classic arcade game to help with arm mobility.
            </p>
            <p>
                You will select a difficulty before starting the game.
            </p>
            </br>
        </div>

        <button type="button" id="startGameBtn" class="cta-button">
            Start Game
        </button>
        
        </br>

        <div class="pong-container" id="pongContainer">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div class="game-controls">
                <button id="gameControlButton">Start</button>
                <div class="difficulty-controls">
                    <button id="easyBtn">Easy</button>
                    <button id="mediumBtn">Medium</button>
                    <button id="hardBtn">Hard</button>
                </div>
            </div>
        </div>

        <label class="webcam-toggle">
                <input type="checkbox" id="toggleWebcam" checked>
                Show camera preview
            </label>

        <!-- Webcam preview under the game -->
        <div id="webcamContainer" class="webcam-container">

            <div class="webcam-video-wrapper">
                <video id="webcam" autoplay playsinline></video>
                <!-- overlay drawn by JS -->
                <canvas id="webcamOverlay"></canvas>
            </div>
        </div>

        <a href="{% url 'game_select' %}" class="back-link">← Back to Game Select</a>
    </div>

    <script src="{% static 'js/pong.js' %}"></script>

    <!-- TF.js + MediaPipe Hands backend (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script> <!-- handPoseDetection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script> <!-- MediaPipe runtime -->

    <!-- Hand control logic -->
    <script src="{% static 'js/pong_hand_control.js' %}"></script>

    <script>
        const startBtn = document.getElementById('startGameBtn');
        const container = document.getElementById('pongContainer');
        const webcamContainer = document.getElementById('webcamContainer');
        const toggleCheckbox = document.getElementById('toggleWebcam');

        // --- FIX 1: Add the toggle logic back in ---
        function setWebcamVisibility() {
            if (toggleCheckbox.checked) {
                webcamContainer.style.display = 'flex';
            } else {
                webcamContainer.style.display = 'none';
            }
        }
        toggleCheckbox.addEventListener('change', setWebcamVisibility);

        // --- FIX 2: Start the camera on page load, NOT after clicking start ---
        async function initializeCamera() {
            // Start webcam + hand tracking immediately
            if (window.initHandControl) {
                try {
                    await window.initHandControl();
                } catch (err) {
                    console.error("Error initializing hand control:", err);
                    // Handle error (e.g., show a message)
                }
            }
            // Now that the camera is (or isn't) running, set the initial visibility
            setWebcamVisibility();
        }

        // Run the camera setup when the page finishes loading
        window.addEventListener('load', initializeCamera);

        // --- FIX 3: Simplify the start button ---
        // It only needs to show the game canvas and disable itself
        startBtn.addEventListener('click', () => {
            // Show game canvas and controls
            container.style.display = 'block';

            // The camera and toggle are already working.
            // If your pong.js file has a 'start' function, call it here.

            startBtn.disabled = true;
            startBtn.textContent = "Game Running...";
        });
    </script>
</body>
</html>
