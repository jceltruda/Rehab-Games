<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoulder Rehab Driver</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* Light sky blue background */
            color: #333;
        }
        h1 {
            color: #4682b4; /* Steel blue */
        }
        .game-container {
            position: relative;
            width: 400px; /* Fixed width */
            height: 600px; /* Fixed height */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), 0 6px 6px rgba(0,0,0,0.15);
        }
        canvas {
            display: block;
            background-color: #34495e; /* Fallback road color */
            border-radius: 8px;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through */
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        #score {
            position: absolute;
            top: 30px;
            left: 44px; /* Positioned on the left grass/water area */
            transform: translateX(-50%);
            font-size: 48px;
            z-index: 10;
        }
        .message-box {
            display: none; /* Hidden by default */
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            pointer-events: all; /* Clickable */
        }
        .message-box h2 {
            margin-top: 0;
            font-size: 2.5rem;
        }
        .message-box p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .difficulty-option {
            font-size: 1.8rem;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .difficulty-option.selected {
            background-color: #FFD700; /* Yellow */
            color: #333;
            text-shadow: none;
        }
        .instructions {
            font-size: 1rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Shoulder Rehab Driver</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="ui-layer">
            <div id="score">0</div>
            
            <!-- Menu Screen -->
            <div id="menu-container" class="message-box">
                <h2 id="menu-title">Shoulder Driver</h2>
                <p id="menu-status">Loading assets...</p>
                <div id="difficulty-list">
                    <!-- Options will be generated by JS -->
                </div>
                <p classid="instructions" id="menu-instructions" style="display: none;">Use UP/DOWN to select<br/>Press ENTER to start</p>
            </div>
            
            <!-- Game Over Screen -->
            <div id="game-over-container" class="message-box">
                <h2 id="game-over-title">Game Over</h2>
                <p id="game-over-score">Score: 0</p>
                <p class="instructions">Press ENTER to return to menu</p>
            </div>
        </div>
    </div>
    <p>Use <b>Arrow Keys</b> to move. (LEFT, RIGHT)</p>

    <script>
        // --- Setup (Canvas & Context) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- UI Elements ---
        const scoreEl = document.getElementById('score');
        const menuContainerEl = document.getElementById('menu-container');
        const menuStatusEl = document.getElementById('menu-status');
        const difficultyListEl = document.getElementById('difficulty-list');
        const menuInstructionsEl = document.getElementById('menu-instructions');
        const gameOverContainerEl = document.getElementById('game-over-container');
        const gameOverScoreEl = document.getElementById('game-over-score');

        // --- Game Constants (from Python file) ---
        // Tuned to match the 'drive_background.png' 
        const ROAD_X_START = 120;
        const ROAD_X_END = 260;
        const ROAD_WIDTH = ROAD_X_END - ROAD_X_START; // 224
        const NUM_LANES = 3;
        const LANE_WIDTH = ROAD_WIDTH / NUM_LANES; // ~74.6

        const PLAYER_WIDTH = 30;
        const PLAYER_HEIGHT = 60;
        const OBSTACLE_WIDTH = 30;
        const OBSTACLE_HEIGHT = 60;
        
        const PLAYER_STEER_SPEED = 5;

        // --- Difficulty Settings ---
        const DIFFICULTY_LEVELS = {
            'Easy': {
                'GAME_SPEED': 4,
                'SPAWN_RATE': 1500 // Milliseconds
            },
            'Medium': {
                'GAME_SPEED': 6,
                'SPAWN_RATE': 1000
            },
            'Hard': {
                'GAME_SPEED': 8,
                'SPAWN_RATE': 600
            }
        };
        const DIFFICULTY_NAMES = ['Easy', 'Medium', 'Hard'];
        
        // --- Global Game Variables ---
        let gameSpeed, obstacleSpawnRate;
        let player, obstacles, score, gameState;
        let selectedDifficultyIndex = 0;
        let roadScrollY = 0; // For vertical background scrolling
        let spawnObstacleTimer = 0;
        let lastTime = 0;

        // --- Asset Loading ---
        const assets = {
            player: new Image(),
            obstacle: new Image(),
            background: new Image()
        };
        
        // Caches for flipped images
        let flippedPlayer = null;
        let flippedObstacle = null;
        
        let assetsLoaded = 0;
        const totalAssets = 3; // player, obstacle, background

        // =================================================================
        // --- SWAPPABLE INPUT SECTION (START) ---
        // =================================================================
        const controls = {
            up: false,
            down: false,
            left: false,
            right: false,
            enter: false
        };

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') controls.up = true;
                if (e.key === 'ArrowDown') controls.down = true;
                if (e.key === 'ArrowLeft') controls.left = true;
                if (e.key === 'ArrowRight') controls.right = true;
                if (e.key === 'Enter') controls.enter = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp') controls.up = false;
                if (e.key === 'ArrowDown') controls.down = false;
                if (e.key === 'ArrowLeft') controls.left = false;
                if (e.key === 'ArrowRight') controls.right = false;
                if (e.key === 'Enter') controls.enter = false;
            });
            
            difficultyListEl.addEventListener('click', (e) => {
                if (e.target.classList.contains('difficulty-option')) {
                    selectedDifficultyIndex = parseInt(e.target.dataset.index);
                    updateMenuSelection();
                    startGame(); // Start game on click
                }
            });
        }
        // =================================================================
        // --- SWAPPABLE INPUT SECTION (END) ---
        // =================================================================


        // --- Game Logic ---

        function onAssetLoad() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                // All images are loaded, now process them
                prepareFlippedImages();
                
                // Update menu to show it's ready
                menuStatusEl.innerText = 'Select Difficulty:';
                menuInstructionsEl.style.display = 'block';
                updateMenuSelection();
            }
        }
        
        function prepareFlippedImages() {
            // Create a canvas to flip the player car image
            flippedPlayer = document.createElement('canvas');
            flippedPlayer.width = PLAYER_WIDTH;
            flippedPlayer.height = PLAYER_HEIGHT;
            const pCtx = flippedPlayer.getContext('2d');
            pCtx.translate(0, PLAYER_HEIGHT); // Move origin to bottom-left
            pCtx.scale(1, -1); // Flip vertically
            pCtx.drawImage(assets.player, 0, 0, PLAYER_WIDTH, PLAYER_HEIGHT);

            // Create a canvas to flip the obstacle car image
            flippedObstacle = document.createElement('canvas');
            flippedObstacle.width = OBSTACLE_WIDTH;
            flippedObstacle.height = OBSTACLE_HEIGHT;
            const oCtx = flippedObstacle.getContext('2d');
            oCtx.translate(0, OBSTACLE_HEIGHT); // Move origin to bottom-left
            oCtx.scale(1, -1); // Flip vertically
            oCtx.drawImage(assets.obstacle, 0, 0, OBSTACLE_WIDTH, OBSTACLE_HEIGHT);
        }

        function showMenu() {
            gameState = 'menu';
            gameOverContainerEl.style.display = 'none';
            scoreEl.style.display = 'none';
            menuContainerEl.style.display = 'block';
            
            if (assetsLoaded === totalAssets) {
                menuStatusEl.innerText = 'Select Difficulty:';
                menuInstructionsEl.style.display = 'block';
                updateMenuSelection();
            }
        }
        
        function updateMenuSelection() {
            difficultyListEl.innerHTML = '';
            DIFFICULTY_NAMES.forEach((name, index) => {
                const option = document.createElement('div');
                option.className = 'difficulty-option';
                option.innerText = name;
                option.dataset.index = index;
                if (index === selectedDifficultyIndex) {
                    option.classList.add('selected');
                }
                difficultyListEl.appendChild(option);
            });
        }

        function setGameOver() {
            gameState = 'gameOver';
            gameOverScoreEl.innerText = `Score: ${score}`;
            gameOverContainerEl.style.display = 'block';
        }
        
        function startGame() {
            const diff = DIFFICULTY_NAMES[selectedDifficultyIndex];
            gameSpeed = DIFFICULTY_LEVELS[diff]['GAME_SPEED'];
            obstacleSpawnRate = DIFFICULTY_LEVELS[diff]['SPAWN_RATE'];

            player = {
                x: ROAD_X_START + (LANE_WIDTH * 1.5) - (PLAYER_WIDTH / 2),
                y: canvas.height - PLAYER_HEIGHT - 20,
                width: PLAYER_WIDTH,
                height: PLAYER_HEIGHT
            };
            
            obstacles = [];
            score = 0;
            spawnObstacleTimer = obstacleSpawnRate; // Spawn one soon
            roadScrollY = 0;
            
            scoreEl.innerText = score;
            gameState = 'playing';
            
            menuContainerEl.style.display = 'none';
            gameOverContainerEl.style.display = 'none';
            scoreEl.style.display = 'block';
            
            lastTime = performance.now(); // Reset time for delta
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * NUM_LANES); // 0, 1, or 2
            const x = (ROAD_X_START + (lane * LANE_WIDTH)) + (LANE_WIDTH / 2) - (OBSTACLE_WIDTH / 2);
            
            obstacles.push({
                x: x,
                y: -OBSTACLE_HEIGHT, // Start just above the screen
                width: OBSTACLE_WIDTH,
                height: OBSTACLE_HEIGHT
            });
        }
        
        function updatePlayer() {
            if (controls.left) {
                player.x -= PLAYER_STEER_SPEED;
            }
            if (controls.right) {
                player.x += PLAYER_STEER_SPEED;
            }
            
            // Clamp player to the road
            if (player.x < ROAD_X_START) {
                player.x = ROAD_X_START;
            }
            if (player.x + player.width > ROAD_X_END) {
                player.x = ROAD_X_END - player.width;
            }
        }
        
        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += gameSpeed;

                // Remove if off-screen
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreEl.innerText = score;
                }
            }
        }
        
        function updateBackground(deltaTime) {
            if (!assets.background.complete || assets.background.naturalWidth === 0) return;
            
            roadScrollY += gameSpeed;
            // Use the actual height of the loaded image for looping
            if (roadScrollY >= assets.background.height) {
                roadScrollY = 0;
            }
            
            spawnObstacleTimer -= deltaTime;
            if (spawnObstacleTimer <= 0) {
                spawnObstacle();
                spawnObstacleTimer = obstacleSpawnRate;
            }
        }

        function checkCollisions() {
            for (const obs of obstacles) {
                // Simple AABB (Axis-Aligned Bounding Box) collision detection
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    
                    setGameOver();
                    return; // Exit loop on first collision
                }
            }
        }

        // --- Rendering ---

        function drawPlayer() {
            if (flippedPlayer) {
                ctx.drawImage(flippedPlayer, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#ff4136'; // Red fallback
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                if (flippedObstacle) {
                    ctx.drawImage(flippedObstacle, obs.x, obs.y, obs.width, obs.height);
                } else {
                    ctx.fillStyle = '#0074D9'; // Blue fallback
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                }
            });
        }
        
        function drawBackground() {
            if (!assets.background.complete || assets.background.naturalWidth === 0) {
                // Fallback drawing
                ctx.fillStyle = '#16a085'; // Green grass
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#34495e'; // Grey road
                ctx.fillRect(ROAD_X_START, 0, ROAD_WIDTH, canvas.height);
                return;
            }
            
            const imgHeight = assets.background.height;
            // Draw the image, shifted by scroll_y
            ctx.drawImage(assets.background, 0, roadScrollY, canvas.width, imgHeight);
            // Draw a second image immediately above the first to create a loop
            ctx.drawImage(assets.background, 0, roadScrollY - imgHeight, canvas.width, imgHeight);
        }
        
        // --- Main Game Loop ---

        function gameLoop(timestamp) {
            // Calculate delta time (time since last frame) for smooth, consistent speed
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            switch (gameState) {
                case 'menu':
                    drawPlayer(); // Show static player
                    // Listen for keyboard input
                    if (assetsLoaded === totalAssets) {
                        if (controls.up) {
                            selectedDifficultyIndex = (selectedDifficultyIndex - 1 + DIFFICULTY_NAMES.length) % DIFFICULTY_NAMES.length;
                            updateMenuSelection();
                            controls.up = false; // Consume input
                        }
                        if (controls.down) {
                            selectedDifficultyIndex = (selectedDifficultyIndex + 1) % DIFFICULTY_NAMES.length;
                            updateMenuSelection();
                            controls.down = false; // Consume input
                        }
                        if (controls.enter) {
                            startGame();
                            controls.enter = false; // Consume input
                        }
                    }
                    break;
                
                case 'playing':
                    updatePlayer();
                    updateObstacles();
                    updateBackground(deltaTime); // Pass delta time for timers
                    
                    drawObstacles();
                    drawPlayer();
                    
                    checkCollisions();
                    break;

                case 'gameOver':
                    // Draw the final scene
                    drawObstacles();
                    drawPlayer();
                    
                    // Listen for restart
                    if (controls.enter) {
                        showMenu();
                        controls.enter = false; 
                    }
                    break;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // --- Start the game ---
        function init() {
            setupKeyboardControls();
            
            // Initialize player for menu
            player = {
                x: ROAD_X_START + (LANE_WIDTH * 1.5) - (PLAYER_WIDTH / 2),
                y: canvas.height - PLAYER_HEIGHT - 20,
                width: PLAYER_WIDTH,
                height: PLAYER_HEIGHT
            };
            
            // Show menu immediately
            showMenu();
            
            // Start loading assets
            assets.player.onload = onAssetLoad;
            assets.obstacle.onload = onAssetLoad;
            assets.background.onload = onAssetLoad;
            
            // ************
            // IMPORTANT: Make sure these paths are correct for your Django setup!
            // You may need to use Django's {% static '...' %} tag.
            // ************
            assets.player.src = "{% static 'driver_car.png' %}";
            assets.obstacle.src = "{% static 'obstacle_car.png' %}";
            assets.background.src = "{% static 'road_background.png' %}";
            
            // Start game loop
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        init();

    </script>
</body>
</html>
