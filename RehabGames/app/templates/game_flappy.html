<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoulder-Bird Rehab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* Light sky blue background */
            color: #333;
        }
        h1 {
            color: #4682b4; /* Steel blue */
        }
        .game-container {
            position: relative;
            width: 400px; /* Fixed width */
            height: 600px; /* Fixed height */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), 0 6px 6px rgba(0,0,0,0.15);
        }
        canvas {
            display: block;
            background-color: #70c5ce; /* Brighter sky blue for canvas */
            border-radius: 8px;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through */
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        #score {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            z-index: 10;
        }
        .message-box {
            display: none; /* Hidden by default */
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            pointer-events: all; /* Clickable */
        }
        .message-box h2 {
            margin-top: 0;
            font-size: 2.5rem;
        }
        .message-box p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .difficulty-option {
            font-size: 1.8rem;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .difficulty-option.selected {
            background-color: #FFD700; /* Yellow */
            color: #333;
            text-shadow: none;
        }
        .instructions {
            font-size: 1rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Shoulder-Bird Rehab</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="ui-layer">
            <div id="score">0</div>
            
            <!-- Menu Screen -->
            <div id="menu-container" class="message-box">
                <h2 id="menu-title">Shoulder-Bird</h2>
                <p id="menu-status">Loading assets...</p>
                <div id="difficulty-list">
                    <!-- Options will be generated by JS -->
                </div>
                <p classid="instructions" id="menu-instructions" style="display: none;">Use UP/DOWN to select<br/>Press ENTER to start</p>
            </div>
            
            <!-- Game Over Screen -->
            <div id="game-over-container" class="message-box">
                <h2 id="game-over-title">Game Over</h2>
                <p id="game-over-score">Score: 0</p>
                <p class="instructions">Press ENTER to return to menu</p>
            </div>
        </div>
    </div>
    <p>Use <b>Arrow Keys</b> to move. (UP, DOWN, LEFT, RIGHT)</p>

    <script>
        // --- Setup (Canvas & Context) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- UI Elements ---
        const scoreEl = document.getElementById('score');
        const menuContainerEl = document.getElementById('menu-container');
        const menuStatusEl = document.getElementById('menu-status');
        const difficultyListEl = document.getElementById('difficulty-list');
        const menuInstructionsEl = document.getElementById('menu-instructions');
        const gameOverContainerEl = document.getElementById('game-over-container');
        const gameOverScoreEl = document.getElementById('game-over-score');

        // --- Game Constants (from Python file) ---
        const BIRD_WIDTH = 95;
        const BIRD_HEIGHT = 95;
        const FAST_FALL_STRENGTH = 1.5; // This can stay constant
        const PIPE_WIDTH = 80;

        // --- Hitbox Adjustment (from Python file) ---
        const HITBOX_X_SHRINK = 40;
        const HITBOX_Y_SHRINK = 54;

        // --- Difficulty Settings ---
        // Physics are now *inside* the difficulty levels
        const DIFFICULTY_LEVELS = {
            'Easy': {
                'PIPE_GAP': 275,        // VERY wide gap
                'PIPE_SPEED': 1.2,      // Very slow
                'PIPE_SPACING': 180,    // Lots of time between pipes
                'GRAVITY': 0.08,        // Extremely floaty
                'FLAP_STRENGTH': -3.5,  // Very gentle, small hop
                'HORIZONTAL_SPEED': 2.5 // Slower side-to-side
            },
            'Medium': {
                'PIPE_GAP': 225,        // What 'Easy' was
                'PIPE_SPEED': 1.6,      // A bit faster
                'PIPE_SPACING': 150,    // More time than old 'Easy'
                'GRAVITY': 0.12,        // Still floaty, but noticeable
                'FLAP_STRENGTH': -4.0,  // Gentle hop
                'HORIZONTAL_SPEED': 3.0 // Standard side-to-side
            },
            'Hard': {
                'PIPE_GAP': 180,        // A bit more than old 'Medium'
                'PIPE_SPEED': 2.0,      // What 'Medium' was
                'PIPE_SPACING': 120,    // What 'Medium' was
                'GRAVITY': 0.18,        // What 'Medium' was
                'FLAP_STRENGTH': -4.8,  // A solid hop, less than old 'Medium'
                'HORIZONTAL_SPEED': 3.5 // Quicker side-to-side
            }
        };
        const DIFFICULTY_NAMES = ['Easy', 'Medium', 'Hard'];

        // --- Global Game Variables ---
        // These will be set by the difficulty menu
        let gamePipeGap, gamePipeSpeed, gamePipeSpacing;
        let gameGravity, gameFlapStrength, gameHorizontalSpeed;
        
        let bird, pipes, score, frame, gameState;
        let selectedDifficultyIndex = 0;

        // --- Asset Loading ---
        const assets = {
            bird: new Image(),
            pipeBottom: new Image(),
            pipeTop: null // This will be a canvas
        };
        let pipeImgHeight = 500; // Default/fallback
        let assetsLoaded = 0;
        const totalAssets = 2; // bird + pipe

        // =================================================================
        // --- SWAPPABLE INPUT SECTION (START) ---
        // =================================================================
        const controls = {
            up: false,
            down: false,
            left: false,
            right: false,
            enter: false
        };

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') controls.up = true;
                if (e.key === 'ArrowDown') controls.down = true;
                if (e.key === 'ArrowLeft') controls.left = true;
                if (e.key === 'ArrowRight') controls.right = true;
                if (e.key === 'Enter') controls.enter = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp') controls.up = false;
                if (e.key === 'ArrowDown') controls.down = false;
                if (e.key === 'ArrowLeft') controls.left = false;
                if (e.key === 'ArrowRight') controls.right = false;
                if (e.key === 'Enter') controls.enter = false;
            });
            
            difficultyListEl.addEventListener('click', (e) => {
                if (e.target.classList.contains('difficulty-option')) {
                    selectedDifficultyIndex = parseInt(e.target.dataset.index);
                    updateMenuSelection();
                    startGame(); // Start game on click
                }
            });
        }
        // =================================================================
        // --- SWAPPABLE INPUT SECTION (END) ---
        // =================================================================


        // --- Game Logic ---

        function onAssetLoad() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                // All images are loaded, now process them
                preparePipeImages();
                
                // Update menu to show it's ready
                menuStatusEl.innerText = 'Select Difficulty:';
                menuInstructionsEl.style.display = 'block';
                updateMenuSelection();
            }
        }
        
        function preparePipeImages() {
            // Calculate scaled height
            const originalWidth = assets.pipeBottom.width;
            const originalHeight = assets.pipeBottom.height;
            const scaleFactor = PIPE_WIDTH / originalWidth;
            pipeImgHeight = Math.floor(originalHeight * scaleFactor);
            
            // Resize bottom pipe image (by drawing to a new canvas)
            const bottomCanvas = document.createElement('canvas');
            bottomCanvas.width = PIPE_WIDTH;
            bottomCanvas.height = pipeImgHeight;
            bottomCanvas.getContext('2d').drawImage(assets.pipeBottom, 0, 0, PIPE_WIDTH, pipeImgHeight);
            assets.pipeBottom = bottomCanvas; // Now pipeBottom is a canvas
            
            // Create top pipe image by flipping
            const topCanvas = document.createElement('canvas');
            topCanvas.width = PIPE_WIDTH;
            topCanvas.height = pipeImgHeight;
            const topCtx = topCanvas.getContext('2d');
            
            topCtx.translate(0, pipeImgHeight); // Move origin to bottom-left
            topCtx.scale(1, -1);                // Flip vertically
            topCtx.drawImage(assets.pipeBottom, 0, 0, PIPE_WIDTH, pipeImgHeight);
            
            assets.pipeTop = topCanvas; // Store the flipped canvas
        }

        function showMenu() {
            gameState = 'menu';
            gameOverContainerEl.style.display = 'none';
            scoreEl.style.display = 'none';
            menuContainerEl.style.display = 'block';
            
            if (assetsLoaded === totalAssets) {
                menuStatusEl.innerText = 'Select Difficulty:';
                menuInstructionsEl.style.display = 'block';
                updateMenuSelection();
            }
        }
        
        function updateMenuSelection() {
            difficultyListEl.innerHTML = '';
            DIFFICULTY_NAMES.forEach((name, index) => {
                const option = document.createElement('div');
                option.className = 'difficulty-option';
                option.innerText = name;
                option.dataset.index = index;
                if (index === selectedDifficultyIndex) {
                    option.classList.add('selected');
                }
                difficultyListEl.appendChild(option);
            });
        }

        function setGameOver() {
            gameState = 'gameOver';
            gameOverScoreEl.innerText = `Score: ${score}`;
            gameOverContainerEl.style.display = 'block';
        }
        
        function startGame() {
            // --- UPDATED: Set all game variables from difficulty ---
            const diff = DIFFICULTY_NAMES[selectedDifficultyIndex];
            gamePipeGap = DIFFICULTY_LEVELS[diff]['PIPE_GAP'];
            gamePipeSpeed = DIFFICULTY_LEVELS[diff]['PIPE_SPEED'];
            gamePipeSpacing = DIFFICULTY_LEVELS[diff]['PIPE_SPACING'];
            gameGravity = DIFFICULTY_LEVELS[diff]['GRAVITY'];
            gameFlapStrength = DIFFICULTY_LEVELS[diff]['FLAP_STRENGTH'];
            gameHorizontalSpeed = DIFFICULTY_LEVELS[diff]['HORIZONTAL_SPEED'];
            // --- End of update ---

            bird = {
                x: canvas.width / 4,
                y: canvas.height / 2,
                width: BIRD_WIDTH,
                height: BIRD_HEIGHT,
                velocityY: 0,
                velocityX: 0
            };
            pipes = [];
            score = 0;
            frame = 0;
            scoreEl.innerText = score;
            gameState = 'playing';
            menuContainerEl.style.display = 'none';
            gameOverContainerEl.style.display = 'none';
            scoreEl.style.display = 'block';
        }

        function spawnPipe() {
            // Use gamePipeGap (now set by difficulty)
            const gapTop = Math.random() * (canvas.height - gamePipeGap - 100) + 50; // 50px padding
            const gapEnd = gapTop + gamePipeGap;
            
            pipes.push({
                x: canvas.width,
                width: PIPE_WIDTH,
                gapTop: gapTop,         // Y-coord for bottom of top pipe
                gapHeight: gamePipeGap,
                topRectY: gapTop - pipeImgHeight, // Y-coord to start drawing top pipe
                bottomRectY: gapEnd,        // Y-coord to start drawing bottom pipe
                passed: false
            });
        }
        
        function getHitbox(bird) {
            const dx = HITBOX_X_SHRINK / 2;
            const dy = HITBOX_Y_SHRINK / 2;
            return {
                x: bird.x + dx,
                y: bird.y + dy,
                width: bird.width - HITBOX_X_SHRINK,
                height: bird.height - HITBOX_Y_SHRINK
            };
        }

        function updateBird() {
            // --- UPDATED: Use game-specific physics variables ---
            bird.velocityY += gameGravity;

            if (controls.up) {
                bird.velocityY = gameFlapStrength;
                controls.up = false; 
            }
            if (controls.down) {
                bird.velocityY += FAST_FALL_STRENGTH;
            }
            
            bird.velocityX = 0;
            if (controls.left) {
                bird.velocityX = -gameHorizontalSpeed;
            }
            if (controls.right) {
                bird.velocityX = gameHorizontalSpeed;
            }
            // --- End of update ---

            bird.y += bird.velocityY;
            bird.x += bird.velocityX;

            if (bird.x < 0) bird.x = 0;
            if (bird.x + bird.width > canvas.width) bird.x = canvas.width - bird.width;

            const hitbox = getHitbox(bird);
            if (hitbox.y + hitbox.height > canvas.height || hitbox.y < 0) {
                setGameOver();
            }
        }

        function updatePipes() {
            // Use gamePipeSpacing (now set by difficulty)
            if (frame % gamePipeSpacing === 0) {
                spawnPipe();
            }
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                // Use gamePipeSpeed (now set by difficulty)
                pipe.x -= gamePipeSpeed;

                if (pipe.x + pipe.width < 0) {
                    pipes.splice(i, 1);
                    continue;
                }

                if (!pipe.passed && pipe.x < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreEl.innerText = score;
                }

                if (checkCollision(bird, pipe)) {
                    setGameOver();
                }
            }
        }

        function checkCollision(bird, pipe) {
            const hitbox = getHitbox(bird);
            
            // Check X overlap (basic)
            if (hitbox.x < pipe.x + pipe.width && hitbox.x + hitbox.width > pipe.x) {
                // Check Y overlap (top pipe)
                if (hitbox.y < pipe.gapTop) {
                    return true;
                }
                // Check Y overlap (bottom pipe)
                if (hitbox.y + hitbox.height > pipe.bottomRectY) {
                    return true;
                }
            }
            
            return false;
        }

        // --- Rendering ---

        function drawBird() {
            if (assets.bird.complete) {
                ctx.drawImage(assets.bird, bird.x, bird.y, bird.width, bird.height);
            } else {
                ctx.fillStyle = 'yellow';
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
            }
            
            // --- Optional: Uncomment to see the hitbox ---
            // const hitbox = getHitbox(bird);
            // ctx.strokeStyle = 'red';
            // ctx.lineWidth = 2;
            // ctx.strokeRect(hitbox.x, hitbox.y, hitbox.width, hitbox.height);
        }

        function drawPipes() {
            if (!assets.pipeTop) { // Fallback if images aren't loaded
                ctx.fillStyle = '#008000'; // Green
                pipes.forEach(pipe => {
                    ctx.fillRect(pipe.x, 0, pipe.width, pipe.gapTop);
                    ctx.fillRect(pipe.x, pipe.gapTop + pipe.gapHeight, pipe.width, canvas.height - (pipe.gapTop + pipe.gapHeight));
                });
                return;
            }
            
            pipes.forEach(pipe => {
                // Draw top pipe (flipped)
                ctx.drawImage(assets.pipeTop, pipe.x, pipe.topRectY, pipe.width, pipeImgHeight);
                // Draw bottom pipe (regular)
                ctx.drawImage(assets.pipeBottom, pipe.x, pipe.bottomRectY, pipe.width, pipeImgHeight);
            });
        }
        
        function drawBackground() {
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- Main Game Loop ---

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            switch (gameState) {
                case 'menu':
                    drawBird(); // Show bird
                    if (assetsLoaded === totalAssets) {
                        if (controls.up) {
                            selectedDifficultyIndex = (selectedDifficultyIndex - 1 + DIFFICULTY_NAMES.length) % DIFFICULTY_NAMES.length;
                            updateMenuSelection();
                            controls.up = false; // Consume input
                        }
                        if (controls.down) {
                            selectedDifficultyIndex = (selectedDifficultyIndex + 1) % DIFFICULTY_NAMES.length;
                            updateMenuSelection();
                            controls.down = false; // Consume input
                        }
                        if (controls.enter) {
                            startGame();
                            controls.enter = false; // Consume input
                        }
                    }
                    break;
                
                case 'playing':
                    frame++;
                    updateBird();
                    updatePipes();
                    drawPipes();
                    drawBird();
                    break;

                case 'gameOver':
                    drawPipes();
                    drawBird();
                    if (controls.enter) {
                        showMenu();
                        controls.enter = false; 
                    }
                    break;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // --- Start the game ---
        function init() {
            setupKeyboardControls();
            
            // Initialize bird for menu
            bird = {
                x: canvas.width / 4,
                y: canvas.height / 2,
                width: BIRD_WIDTH,
                height: BIRD_HEIGHT,
                velocityY: 0,
                velocityX: 0
            };
            
            // Show menu immediately
            showMenu();
            
            // Start loading assets
            assets.bird.onload = onAssetLoad;
            assets.pipeBottom.onload = onAssetLoad;
            
            // ************
            // IMPORTANT: Make sure these paths are correct for your Django setup!
            // You may need to use Django's {% static 'flappyBird/bird.png' %} template tag.
            // ************
            assets.bird.src = "{% static 'bird.png' %}";
            assets.pipeBottom.src = "{% static 'pipe.png' %}";
            
            // Start game loop
            gameLoop();
        }

        init();

    </script>
</body>
</html>
