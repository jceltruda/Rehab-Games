{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehab Games - Select Game</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>
    <div id="cursor-glow"></div>
    <h1>Choose Your Game</h1>
    <div class="game-grid">
        <a href="{% url 'game_pong' %}" class="game-card">
            <h3>Pong</h3>
            <p>Vertical Arm Movement</p>
        </a>
        <a href="{% url 'game_flappy' %}" class="game-card">
            <h3>Flappy Bird</h3>
            <p>Lateral Arm Raises</p>
        </a>
        <a href="{% url 'game_arkanoid' %}" class="game-card">
            <h3>Arkanoid</h3>
            <p>Horizontal Arm Movement</p>
        </a>
    </div>
    <a href="/" class="cta-button" style="margin-top: 3rem;">Back to Home</a>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const glow = document.getElementById('cursor-glow');
            if (!glow) return;

            window.addEventListener('pointermove', (e) => {
            glow.style.opacity = '1';
            glow.style.left = e.clientX + 'px';
            glow.style.top  = e.clientY + 'px';
            });

            window.addEventListener('pointerdown', () => {
            glow.classList.add('clicking');
            });

            window.addEventListener('pointerup', () => {
            glow.classList.remove('clicking');
            });

            window.addEventListener('pointerleave', () => {
            glow.style.opacity = '0';
            });
        });
        </script>
        
</body>
</html>
